# SearXNG for LOKI's web_search tool. Private instance bound to 127.0.0.1 (see docker-compose.yml).
use_default_settings: true

general:
  instance_name: "LOKI search"

server:
  # Only reachable from this machine; replaced at container start if SEARXNG_SECRET is set.
  secret_key: "loki-local-only-change-me"
  limiter: false          # bot limiter is for public instances; this one serves only LOKI
  image_proxy: false
  public_instance: false

search:
  safe_search: 1
  formats:
    - html
    - json                # LOKI reads results as JSON

ui:
  query_in_title: false

outgoing:
  request_timeout: 4.0
  max_request_timeout: 8.0
