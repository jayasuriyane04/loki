# LOKI's data services. Start the database with:  docker compose up -d postgres
# backend/.env: DATABASE_URL=postgresql+asyncpg://loki:loki@127.0.0.1:5432/loki
# (use 127.0.0.1, not localhost: on Windows, localhost tries IPv6 first and every new connection stalls)
# Redis is defined for later phases (task queue) and isn't used yet.
services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped  # comes back with Docker Desktop after a reboot
    environment:
      POSTGRES_USER: loki
      POSTGRES_PASSWORD: loki  # local development only
      POSTGRES_DB: loki
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loki"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]

volumes:
  pgdata:
