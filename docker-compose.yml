# LOKI's data services. Start the database with:  docker compose up -d postgres
# backend/.env: DATABASE_URL=postgresql+asyncpg://loki:loki@127.0.0.1:5432/loki
# (use 127.0.0.1, not localhost: on Windows, localhost tries IPv6 first and every new connection stalls)
# Redis is defined for later phases (task queue) and isn't used yet.
services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped  # comes back with Docker Desktop after a reboot
    environment:
      POSTGRES_USER: loki
      POSTGRES_PASSWORD: loki  # local development only
      POSTGRES_DB: loki
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loki"]
      interval: 5s
      retries: 10

  searxng:  # private meta-search for LOKI's web_search tool (no API key)
    image: searxng/searxng:2026.11.20-cd6d28091
    restart: unless-stopped
    ports: ["127.0.0.1:8888:8080"]
    environment:
      SEARXNG_BASE_URL: http://127.0.0.1:8888/
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro

  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]

volumes:
  pgdata:
